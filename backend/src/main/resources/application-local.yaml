spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vid2knowledge}
    username: ${DB_USERNAME:vid2knowledge}
    password: ${DB_PASSWORD:vid2knowledge-local}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS

  allowed-headers:
    - "*"

  allowed-credentials: true

features:
  analysis-preview-enabled: true
