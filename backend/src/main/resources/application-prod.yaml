spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      minimum-idle: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}
          audiences: ${AUTH_AUDIENCE:authenticated}

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.vid2knowledge: INFO
  structured:
    format:
      console: logstash
    json:
      rename:
        level: severity
      exclude: "@version,level_value"

features:
  # This synchronous endpoint has no tenant quota and is intentionally local-only.
  analysis-preview-enabled: false
  auth-enabled: true
  outbox-poller-enabled: ${OUTBOX_POLLER_ENABLED:false}
  legal-acceptance-required: true

task-queue:
  mode: CLOUD_TASKS

payos:
  enabled: ${PAYOS_ENABLED:false}

billing:
  require-profile-before-checkout: true

legal:
  require-production-readiness: ${LEGAL_REQUIRE_PRODUCTION_READINESS:true}
