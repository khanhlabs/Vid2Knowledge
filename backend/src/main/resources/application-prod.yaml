spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      minimum-idle: 0

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.vid2knowledge: INFO

features:
  # This synchronous endpoint has no tenant quota and is intentionally local-only.
  analysis-preview-enabled: false
