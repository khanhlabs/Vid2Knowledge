spring:
  application:
    name: vid2knowledge-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

#-----------docker-------------------------

  docker:
    compose:
      enabled: false

#------------DB----------------------------------

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 2000

server:
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

features:
  analysis-preview-enabled: false

#--------------AI-------------------------------

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.7-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  timeout: ${GEMINI_TIMEOUT:180s}

youtube:
  api-key: ${YOUTUBE_API_KEY:}
  base-url: ${YOUTUBE_API_BASE_URL:https://www.googleapis.com/youtube/v3}
  timeout: ${YOUTUBE_API_TIMEOUT:10s}
  max-duration-seconds: ${YOUTUBE_MAX_DURATION_SECONDS:14400}

# Promotional paid rates are tracked as actual cost. Shadow rates use the
# announced post-promotion price so margin does not depend on temporary pricing.
ai-cost:
  actual:
    input-microusd-per-million-tokens: ${AI_ACTUAL_INPUT_MICROUSD:750000}
    output-microusd-per-million-tokens: ${AI_ACTUAL_OUTPUT_MICROUSD:3750000}
    thought-microusd-per-million-tokens: ${AI_ACTUAL_THOUGHT_MICROUSD:3750000}
  shadow:
    input-microusd-per-million-tokens: ${AI_SHADOW_INPUT_MICROUSD:1500000}
    output-microusd-per-million-tokens: ${AI_SHADOW_OUTPUT_MICROUSD:7500000}
    thought-microusd-per-million-tokens: ${AI_SHADOW_THOUGHT_MICROUSD:7500000}
  max-attempts: ${AI_MAX_ATTEMPTS:3}
  lease-duration: ${AI_JOB_LEASE_DURATION:5m}

task-queue:
  mode: ${TASK_QUEUE_MODE:INLINE}
  project: ${GCP_PROJECT:}
  location: ${GCP_TASKS_LOCATION:asia-southeast1}
  analysis-queue: ${GCP_ANALYSIS_QUEUE:analysis}
  worker-base-url: ${WORKER_BASE_URL:}
  service-account-email: ${TASK_SERVICE_ACCOUNT_EMAIL:}
  oidc-audience: ${TASK_OIDC_AUDIENCE:}
  dispatch-interval: ${OUTBOX_DISPATCH_INTERVAL:5s}
  dispatch-batch-size: ${OUTBOX_DISPATCH_BATCH_SIZE:10}
  outbox-max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}

commercial:
  trial-processed-video-seconds: ${TRIAL_PROCESSED_VIDEO_SECONDS:3600}
  trial-duration: ${TRIAL_DURATION:14d}
  invitation-ttl: ${INVITATION_TTL:7d}

payos:
  enabled: ${PAYOS_ENABLED:false}
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  return-url: ${PAYOS_RETURN_URL:}
  cancel-url: ${PAYOS_CANCEL_URL:}
  checkout-ttl: ${PAYOS_CHECKOUT_TTL:30m}

notifications:
  enabled: ${NOTIFICATIONS_ENABLED:false}
  api-key: ${RESEND_API_KEY:}
  from: ${NOTIFICATION_FROM:}
  resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
  frontend-base-url: ${FRONTEND_BASE_URL:}
  encryption-key: ${NOTIFICATION_ENCRYPTION_KEY:}
  batch-size: ${NOTIFICATION_BATCH_SIZE:25}
  max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:8}
  lease-duration: ${NOTIFICATION_LEASE_DURATION:2m}
