spring:
  application:
    name: vid2knowledge-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

#-----------docker-------------------------

  docker:
    compose:
      enabled: false

#------------DB----------------------------------

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 2000

server:
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

features:
  analysis-preview-enabled: false
  legal-acceptance-required: false

legal:
  policy-set-version: ${LEGAL_POLICY_SET_VERSION:2026-09-draft}
  terms-version: ${LEGAL_TERMS_VERSION:2026-09-draft}
  terms-url: ${LEGAL_TERMS_URL:/legal/terms}
  privacy-version: ${LEGAL_PRIVACY_VERSION:2026-09-draft}
  privacy-url: ${LEGAL_PRIVACY_URL:/legal/privacy}
  acceptable-use-version: ${LEGAL_ACCEPTABLE_USE_VERSION:2026-09-draft}
  acceptable-use-url: ${LEGAL_ACCEPTABLE_USE_URL:/legal/acceptable-use}
  ai-notice-version: ${LEGAL_AI_NOTICE_VERSION:2026-09-draft}
  ai-notice-url: ${LEGAL_AI_NOTICE_URL:/legal/ai-notice}
  reviewed: ${LEGAL_REVIEWED:false}
  require-production-readiness: ${LEGAL_REQUIRE_PRODUCTION_READINESS:false}

#--------------AI-------------------------------

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.7-flash}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  timeout: ${GEMINI_TIMEOUT:180s}

youtube:
  api-key: ${YOUTUBE_API_KEY:}
  base-url: ${YOUTUBE_API_BASE_URL:https://www.googleapis.com/youtube/v3}
  timeout: ${YOUTUBE_API_TIMEOUT:10s}
  max-duration-seconds: ${YOUTUBE_MAX_DURATION_SECONDS:14400}

# Promotional paid rates are tracked as actual cost. Shadow rates use the
# announced post-promotion price so margin does not depend on temporary pricing.
ai-cost:
  actual:
    input-microusd-per-million-tokens: ${AI_ACTUAL_INPUT_MICROUSD:750000}
    output-microusd-per-million-tokens: ${AI_ACTUAL_OUTPUT_MICROUSD:3750000}
    thought-microusd-per-million-tokens: ${AI_ACTUAL_THOUGHT_MICROUSD:3750000}
  shadow:
    input-microusd-per-million-tokens: ${AI_SHADOW_INPUT_MICROUSD:1500000}
    output-microusd-per-million-tokens: ${AI_SHADOW_OUTPUT_MICROUSD:7500000}
    thought-microusd-per-million-tokens: ${AI_SHADOW_THOUGHT_MICROUSD:7500000}
  max-attempts: ${AI_MAX_ATTEMPTS:3}
  lease-duration: ${AI_JOB_LEASE_DURATION:5m}

task-queue:
  mode: ${TASK_QUEUE_MODE:INLINE}
  project: ${GCP_PROJECT:}
  location: ${GCP_TASKS_LOCATION:asia-southeast1}
  analysis-queue: ${GCP_ANALYSIS_QUEUE:analysis}
  worker-base-url: ${WORKER_BASE_URL:}
  service-account-email: ${TASK_SERVICE_ACCOUNT_EMAIL:}
  oidc-audience: ${TASK_OIDC_AUDIENCE:}
  dispatch-interval: ${OUTBOX_DISPATCH_INTERVAL:5s}
  dispatch-batch-size: ${OUTBOX_DISPATCH_BATCH_SIZE:10}
  outbox-max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}

commercial:
  trial-processed-video-seconds: ${TRIAL_PROCESSED_VIDEO_SECONDS:3600}
  trial-qa-queries: ${TRIAL_QA_QUERIES:20}
  trial-duration: ${TRIAL_DURATION:14d}
  invitation-ttl: ${INVITATION_TTL:7d}

payos:
  enabled: ${PAYOS_ENABLED:false}
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  return-url: ${PAYOS_RETURN_URL:}
  cancel-url: ${PAYOS_CANCEL_URL:}
  checkout-ttl: ${PAYOS_CHECKOUT_TTL:30m}

notifications:
  enabled: ${NOTIFICATIONS_ENABLED:false}
  api-key: ${RESEND_API_KEY:}
  from: ${NOTIFICATION_FROM:}
  resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
  frontend-base-url: ${FRONTEND_BASE_URL:}
  encryption-key: ${NOTIFICATION_ENCRYPTION_KEY:}
  batch-size: ${NOTIFICATION_BATCH_SIZE:25}
  max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:8}
  lease-duration: ${NOTIFICATION_LEASE_DURATION:2m}

integrations:
  enabled: ${INTEGRATIONS_ENABLED:false}
  encryption-key: ${INTEGRATION_ENCRYPTION_KEY:}
  dispatch-batch-size: ${INTEGRATION_DISPATCH_BATCH_SIZE:25}
  max-attempts: ${INTEGRATION_MAX_ATTEMPTS:8}
  lease-duration: ${INTEGRATION_LEASE_DURATION:2m}
  request-timeout: ${INTEGRATION_REQUEST_TIMEOUT:10s}
object-storage:
  enabled: ${OBJECT_STORAGE_ENABLED:false}
  endpoint: ${OBJECT_STORAGE_ENDPOINT:https://invalid.r2.cloudflarestorage.com}
  bucket: ${OBJECT_STORAGE_BUCKET:}
  access-key-id: ${OBJECT_STORAGE_ACCESS_KEY_ID:}
  secret-access-key: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:}
  max-upload-bytes: ${OBJECT_STORAGE_MAX_UPLOAD_BYTES:524288000}
  presign-duration: ${OBJECT_STORAGE_PRESIGN_DURATION:15m}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  general-mutations: ${RATE_LIMIT_GENERAL_MUTATIONS:240}
  expensive-mutations: ${RATE_LIMIT_EXPENSIVE_MUTATIONS:30}
  payment-mutations: ${RATE_LIMIT_PAYMENT_MUTATIONS:20}
  window: ${RATE_LIMIT_WINDOW:1m}
  max-keys: ${RATE_LIMIT_MAX_KEYS:50000}

retention:
  generation-payload: ${RETENTION_GENERATION_PAYLOAD:30d}
  payment-webhook-payload: ${RETENTION_PAYMENT_WEBHOOK_PAYLOAD:90d}
  terminal-outbox: ${RETENTION_TERMINAL_OUTBOX:30d}
  terminal-notification: ${RETENTION_TERMINAL_NOTIFICATION:30d}
  terminal-invitation: ${RETENTION_TERMINAL_INVITATION:90d}
  terminal-webhook-delivery: ${RETENTION_TERMINAL_WEBHOOK_DELIVERY:30d}
  terminal-integration-credential: ${RETENTION_TERMINAL_INTEGRATION_CREDENTIAL:90d}
  terminal-source-upload: ${RETENTION_TERMINAL_SOURCE_UPLOAD:30d}
