spring:
  application:
    name: vid2knowledge-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

#-----------docker-------------------------

  docker:
    compose:
      enabled: false

#------------DB----------------------------------

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 2000

server:
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

features:
  analysis-preview-enabled: false

#--------------AI-------------------------------

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.7-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  timeout: ${GEMINI_TIMEOUT:180s}
