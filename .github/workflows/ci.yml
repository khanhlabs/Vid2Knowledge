name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  
  push:
    branches:
      - main
      - khanh

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Check frontend formatting
        run: npm run format:check

      - name: Test frontend
        run: npm test

      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium

      - name: Build frontend and run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Generate frontend CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > frontend-sbom.cdx.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend/frontend-sbom.cdx.json
          if-no-files-found: error

  backend:
    name: Backend test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_PROFILES_ACTIVE: local
      GEMINI_API_KEY: ci-not-used
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Generate backend CycloneDX SBOM
        run: ./mvnw --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests -DoutputName=backend-sbom

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/target/backend-sbom.json
          if-no-files-found: error

  browser-integration:
    name: Authenticated buyer-to-learner journey
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [frontend, backend]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run isolated backend and browser journey
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -Pbrowser-e2e test-compile failsafe:integration-test failsafe:verify
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-browser-failures
          path: |
            backend/target/browser-journey.log
            backend/target/failsafe-reports/
            frontend/test-results/full-stack/
          retention-days: 7

  infrastructure:
    name: Terraform validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

  operations:
    name: Operations tooling validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Parse PowerShell operations scripts
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          Get-ChildItem "$PWD/ops/*.ps1" | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

  container-security:
    name: Backend container security
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag vid2knowledge-backend:${{ github.sha }} backend

      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: vid2knowledge-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
